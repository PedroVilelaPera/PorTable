<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PorTable</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

    <link rel="stylesheet" type="text/css" href="main_style.css">
</head>
<body>
    <header></header>
    <main>
        <aside class="side-bar"></aside>
        <div class="sections-conteiner"> 

            <section id="sect-main" class="character-sheet-sect">
                <h1 class="sect-title">--MAIN-INFO--</h1>

                <div id="main-info-conteiner" class="sect-content-conteiner">

                    <div class="sect-main-character-pic"></div>
                    <input type="text" maxlength="30" class="sect-main-character-name-input" placeholder="CHARACTER'S NAME">
                    
                </div>
                <div class="sect-footer">
                    <button id="add-bar" class="bnt black-white">
                        <span class="material-symbols-outlined">add_box</span>
                    </button>
                    <button id="add-status" class="bnt black-white">
                        <span class="material-symbols-outlined">add_box</span>
                    </button>
                </div>
                
            </section>

            <section id="sect-skills" class="character-sheet-sect">
                <h1 class="sect-title">--SKILLS--</h1>
                <div id="skills-conteiner" class="sect-content-conteiner"></div>
                <div class="sect-footer">
                    <button id="add-skill" class="bnt black-white">
                        <span class="material-symbols-outlined">add_box</span>
                    </button>
                </div>
            </section>
            <section id="sect-abilitys" class="character-sheet-sect">
                <h1 class="sect-title">--ABILITYS--</h1>
                <div id="abilitys-conteiner" class="sect-content-conteiner"></div>
                <div class="sect-footer">
                    <button id="add-ability" class="bnt black-white">
                        <span class="material-symbols-outlined">add_box</span>
                    </button>
                </div>
            </section>
        </div>
    </main>
    <script src="main_script.js"></script>
</body>
</html>

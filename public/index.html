<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable</title>

    <link rel="stylesheet" type="text/css" href="css/login_style.css">
    
    <!-- Firebase SDK Link -->
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
    <main>
        <section>
            <img src="assets/dragons.webp" alt="Pixel art dragon holding a D20 dice" id="logo">
            <h1>PorTable</h1>
            <form id="loginForm">
                <h2 class="title">Email:</h2>
                <input type="email" id="email" name="email" required>
                <h2 class="title">Password:</h2>
                <input type="password" id="password" name="password" required>
                <button id="loginBtn" type="submit">Login</button>
            </form>
        </section>
        <p id="p_sign" class="title">Don't have an account? <a href="sign_up.html">Sign-up</a></p>
    </main>
    <script type="module" src="js/controllers/auth_controller.js"></script>
</body>
</html>
